# Deploy to VPS without git on the server: checkout on GitHub → tar → SCP → docker compose.
#
# Required secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (or VPS_SSH_KEY_BASE64)
# Optional: VPS_PORT, VPS_APP_DIR (full path e.g. /home/deployer/el7-hiq)
#
# One-time on VPS: mkdir -p ~/el7-hiq && cp .env.example ~/el7-hiq/.env && edit .env

name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key file
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEY_FILE="${RUNNER_TEMP}/deploy_key"
          umask 077
          if [ -n "$SSH_KEY_B64" ]; then
            echo "$SSH_KEY_B64" | base64 -d > "$KEY_FILE"
          elif [ -n "$SSH_KEY" ]; then
            echo "$SSH_KEY" > "$KEY_FILE"
          else
            echo "::error::Set VPS_SSH_KEY or VPS_SSH_KEY_BASE64."
            exit 1
          fi
          chmod 600 "$KEY_FILE"
          if ! ssh-keygen -y -f "$KEY_FILE" > /dev/null 2>&1; then
            echo "::error::Invalid VPS_SSH_KEY. Use: gh secret set VPS_SSH_KEY < ~/.ssh/github_actions_deploy"
            exit 1
          fi
          echo "KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Verify deploy secrets
        run: |
          test -n "${{ secrets.VPS_HOST }}" || (echo "::error::VPS_HOST empty" && exit 1)
          test -n "${{ secrets.VPS_USER }}" || (echo "::error::VPS_USER empty" && exit 1)

      - name: Create deployment archive
        run: |
          tar czf "${RUNNER_TEMP}/deploy.tgz" \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=frontend/node_modules \
            --exclude=backend/.venv \
            --exclude=backend/data \
            --exclude=.env \
            .
          cp "${RUNNER_TEMP}/deploy.tgz" "${GITHUB_WORKSPACE}/deploy.tgz"
          ls -lh "${GITHUB_WORKSPACE}/deploy.tgz"

      - name: Upload archive to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: ${{ env.KEY_FILE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: deploy.tgz
          target: /tmp
          overwrite: true

      - name: Extract and run Docker on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: ${{ env.KEY_FILE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 45m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="${HOME}/el7-hiq"; fi
            mkdir -p "$APP_DIR"
            ENV_BACK=""
            if [ -f "$APP_DIR/.env" ]; then
              ENV_BACK=$(mktemp)
              cp "$APP_DIR/.env" "$ENV_BACK"
            fi
            tar xzf /tmp/deploy.tgz -C "$APP_DIR"
            rm -f /tmp/deploy.tgz
            if [ -n "$ENV_BACK" ]; then
              cp "$ENV_BACK" "$APP_DIR/.env"
              rm -f "$ENV_BACK"
            fi
            if [ ! -f "$APP_DIR/.env" ]; then
              echo "Missing $APP_DIR/.env — on VPS run: cp $APP_DIR/.env.example $APP_DIR/.env && edit it"
              exit 1
            fi
            cd "$APP_DIR"
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml ps
