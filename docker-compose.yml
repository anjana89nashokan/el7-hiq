version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      APP_SESSION_AUTH_MODE: dev
      DATAMAP_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
